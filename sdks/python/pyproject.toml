[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
name = "makaio-sdk"
version = "0.1.0"
description = "Python SDK for the Makaio Framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["websockets>=16.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/makaio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
