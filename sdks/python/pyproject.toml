[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "makaio-bus"
version = "0.1.0"
description = "Python SDK for the Makaio bus protocol"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["websockets>=15.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/makaio"]
