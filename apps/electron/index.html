<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Makaio</title>
    <style>
      /* ── Reset ────────────────────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #0d0f12;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
      }

      /* ── Logo — matches splash/index.html exactly */
      .loading-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .loading-logo-icon {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 0 18px rgba(99, 102, 241, 0.35));
        animation: glow-pulse 3s ease-in-out infinite;
      }

      .loading-logo-wordmark {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #e9eaed;
        text-transform: uppercase;
      }

      @keyframes glow-pulse {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.2)); }
        50% { filter: drop-shadow(0 0 24px rgba(99, 102, 241, 0.5)); }
      }

      /* ── Loading progress — identical to splash/index.html for visual continuity.
       * Uses the same track+fill structure so percentage widths in the
       * animation resolve relative to the track (300px), not the viewport. */
      .loading-status {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
        max-width: 300px;
      }

      .loading-label {
        font-size: 13px;
        font-weight: 400;
        color: #8b8f98;
        letter-spacing: 0.02em;
        text-align: center;
        min-height: 18px;
        transition: opacity 0.25s ease;
      }

      .loading-track {
        width: 100%;
        height: 3px;
        background: #21262d;
        border-radius: 999px;
        overflow: hidden;
      }

      .loading-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #f59e0b 0%, #818cf8 100%);
        transform-origin: left center;
        animation: indeterminate-slide 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes indeterminate-slide {
        0% {
          width: 0%;
          transform: translateX(0%);
        }
        30% {
          width: 60%;
        }
        70% {
          width: 60%;
          transform: translateX(67%);
        }
        100% {
          width: 0%;
          transform: translateX(200%);
        }
      }
    </style>
  </head>
  <body class="aura-theme">
    <div id="root">
      <!-- Shown while React bootstraps. React replaces #root contents on mount. -->
      <div class="loading-logo">
        <svg
          class="loading-logo-icon"
          viewBox="0 0 400 400"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          focusable="false"
        >
          <defs>
            <clipPath id="splash-clip-right-arch">
              <rect x="14" y="-50" width="100" height="150" transform="rotate(-15 14 5)" />
            </clipPath>
          </defs>
          <g transform="translate(200, 200)" stroke-width="24" stroke-linecap="round" fill="none">
            <path d="M -92 92 A 130 130 0 0 1 -92 -92" stroke="#8A2BE2" opacity="0.8" />
            <path d="M -112.6 -65 A 130 130 0 0 1 112.6 -65" stroke="#00BFFF" opacity="0.8" />
            <path d="M 92 -92 A 130 130 0 0 1 92 92" stroke="#FFD700" opacity="0.8" />
            <path d="M 120 50 A 130 130 0 0 1 0 130" stroke="#FF8C00" opacity="0.8" />
            <path d="M 50 120 A 130 130 0 0 1 -120 50" stroke="#FF1493" opacity="0.8" />
          </g>
          <g transform="translate(195, 195) scale(1.5)" stroke="white" stroke-width="9" stroke-linecap="round" fill="none">
            <path d="M -42 35 L -42 -5 A 21 21 0 0 1 0 -5 L 0 35" />
            <g clip-path="url(#splash-clip-right-arch)">
              <path d="M 4 -5 A 21 21 0 0 1 46 -5 L 46 35" />
            </g>
          </g>
        </svg>
        <span class="loading-logo-wordmark" aria-label="Makaio">MAKAIO</span>
      </div>
      <div class="loading-status">
        <p class="loading-label" id="loading-label" role="status" aria-live="polite" aria-atomic="true">Loading…</p>
        <div class="loading-track" role="progressbar" aria-label="Loading Makaio…" aria-describedby="loading-label">
          <div class="loading-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
