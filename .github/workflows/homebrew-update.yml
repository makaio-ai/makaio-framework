name: Homebrew Update

on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: homebrew-update
  cancel-in-progress: false

jobs:
  update-cask:
    if: "!contains(github.event.release.tag_name, '-canary.')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Download DMG from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "stable-macos-arm64-Makaio.dmg" \
            --dir .

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(sha256sum stable-macos-arm64-Makaio.dmg | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.MAKAIO_GITHUB_APP_ID }}
          private-key: ${{ secrets.MAKAIO_GITHUB_APP_PRIVATE_KEY }}
          owner: makaio-ai
          repositories: homebrew-makaio
          permission-contents: write

      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/makaio-ai/homebrew-makaio.git"
          cd homebrew-makaio

          cat > Casks/makaio.rb << CASK
          cask "makaio" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/${REPO}/releases/download/v#{version}/stable-macos-arm64-Makaio.dmg"
            name "Makaio"
            desc "Runtime for building and hosting AI agent systems"
            homepage "https://makaio.dev"

            depends_on macos: ">= :ventura"

            app "Makaio.app"

            postflight do
              set_permissions "#{appdir}/Makaio.app/Contents/Resources/install-cli.sh", "+x"
              system_command "#{appdir}/Makaio.app/Contents/Resources/install-cli.sh"
            end

            uninstall quit: "ai.makaio.app",
                      delete: "/usr/local/bin/makaio"

            zap trash: [
              "~/.makaio",
              "~/Library/Application Support/ai.makaio.app",
            ]
          end
          CASK

          git add Casks/makaio.rb
          if git diff --cached --quiet; then
            echo "homebrew-makaio already up to date"
            exit 0
          fi
          git commit -m "bump makaio to ${VERSION}"
          git push origin main
