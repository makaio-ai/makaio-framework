name: Homebrew Update

on:
  release:
    types: [released, prereleased]

permissions:
  contents: read

concurrency:
  group: homebrew-update
  cancel-in-progress: false

jobs:
  update-cask:
    if: >-
      github.event.action == 'released' &&
      !contains(github.event.release.tag_name, '-canary.')
    uses: ./.github/workflows/homebrew-update-reusable.yml
    with:
      dmg-pattern: stable-macos-arm64-Makaio.dmg
      cask-file: makaio.rb
      tag: ${{ github.event.release.tag_name }}
      repository: ${{ github.repository }}
      environment: production
    secrets:
      MAKAIO_GITHUB_APP_ID: ${{ secrets.MAKAIO_GITHUB_APP_ID }}
      MAKAIO_GITHUB_APP_PRIVATE_KEY: ${{ secrets.MAKAIO_GITHUB_APP_PRIVATE_KEY }}

  update-canary-cask:
    if: >-
      github.event.action == 'prereleased' &&
      contains(github.event.release.tag_name, '-canary.')
    uses: ./.github/workflows/homebrew-update-reusable.yml
    with:
      dmg-pattern: canary-macos-arm64-Makaio-canary.dmg
      cask-file: makaio-canary.rb
      tag: ${{ github.event.release.tag_name }}
      repository: ${{ github.repository }}
      environment: canary
    secrets:
      MAKAIO_GITHUB_APP_ID: ${{ secrets.MAKAIO_GITHUB_APP_ID }}
      MAKAIO_GITHUB_APP_PRIVATE_KEY: ${{ secrets.MAKAIO_GITHUB_APP_PRIVATE_KEY }}
