name: CI Reusable

on:
  workflow_call:
    inputs:
      framework_root:
        required: false
        type: string
        default: '.'
        description: 'Path to framework root relative to the repository root.'
      test_shards:
        required: false
        type: string
        default: '["Core", "Packages", "Platform", "Adapters", "Extensions", "Apps"]'
        description: 'JSON array of Vitest project/shard names to run in the test matrix.'
      validation_command:
        required: false
        type: string
        default: 'bun scripts/validate.ts --no-fix --cache --tsconfig tsconfig.json'
        description: 'Command to run for validation (lint, format, types).'
      run_sdk_tests:
        required: false
        type: boolean
        default: true
        description: 'Whether to run SDK tests (TypeScript, Python, Rust).'
      skip_labels:
        required: false
        type: string
        default: '["skip:ci", "skip:all"]'
        description: 'JSON array of PR labels that skip CI.'
    outputs:
      docs_only:
        description: 'Whether the PR only changes documentation files.'
        value: ${{ jobs.cache.outputs.docs_only }}

permissions:
  contents: read
  pull-requests: read

env:
  COREPACK_HOME: /tmp/.cache/corepack

jobs:
  precheck:
    name: Precheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_ci: ${{ steps.skip-labels.outputs.skip_ci }}
    steps:
      - name: Check skip labels
        id: skip-labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SKIP_LABELS: ${{ inputs.skip_labels }}
        with:
          script: |
            const configuredLabels = JSON.parse(process.env.SKIP_LABELS || '[]');
            if (!Array.isArray(configuredLabels) || configuredLabels.some((label) => typeof label !== 'string')) {
              throw new Error('skip_labels must be a JSON array of strings');
            }

            const pullRequestLabels = context.payload.pull_request?.labels?.map((label) => label.name) ?? [];
            const skipCi = configuredLabels.some((label) => pullRequestLabels.includes(label));
            core.setOutput('skip_ci', skipCi ? 'true' : 'false');

  cache:
    name: Cache
    needs: precheck
    if: >-
      github.event_name != 'pull_request' ||
      needs.precheck.outputs.skip_ci != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - name: Classify PR changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const requiresValidation = files.some(({ filename: file }) => file === 'docs/package-overview.md');
            const docsOnly = files.length > 0 && !requiresValidation && files.every(({ filename: file }) =>
              file.endsWith('.md') ||
              file.startsWith('docs/') ||
              (file.startsWith('.changeset/') && file.endsWith('.md'))
            );
            core.setOutput('docs_only', docsOnly ? 'true' : 'false');
            if (docsOnly) core.info('Documentation-only PR; skipping CI.');

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
        if: steps.changes.outputs.docs_only != 'true'

      - name: Restore Yarn cache
        if: steps.changes.outputs.docs_only != 'true'
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-${{ runner.os }}-node-24-
            yarn-cache-

      - name: Restore node_modules + toolchain
        if: steps.changes.outputs.docs_only != 'true'
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24

      - name: Enable Corepack
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Save Yarn cache
        if: steps.changes.outputs.docs_only != 'true' && steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Save node_modules + toolchain
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}

  validation:
    name: Validation
    needs: cache
    if: needs.cache.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Restore Yarn cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}
          fail-on-cache-miss: true

      - name: Restore node_modules + toolchain
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}
          fail-on-cache-miss: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Restore ESLint cache
        id: eslint-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .eslintcache
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs') }}-
            eslint-cache-${{ runner.os }}-

      - name: Check build surface invariants
        run: bun ${{ inputs.framework_root }}/scripts/validate-build-surface.ts

      - name: Run combined validator
        run: ${{ inputs.validation_command }}

      - name: Check package overview drift
        run: bun ${{ inputs.framework_root }}/scripts/validate-package-overview.ts

      - name: Check SDK codegen drift
        run: bun ${{ inputs.framework_root }}/scripts/generate-sdk-bindings.ts --check

      - name: Save ESLint cache
        if: always() && steps.eslint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .eslintcache
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs') }}-${{ github.sha }}

  test:
    name: Test (${{ matrix.shard }})
    needs: cache
    if: needs.cache.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(inputs.test_shards) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Restore Yarn cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}
          fail-on-cache-miss: true

      - name: Restore node_modules + toolchain
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}
          fail-on-cache-miss: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run tests
        run: |
          extra=()
          if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
            echo "::notice::Debug logging active — switching vitest to verbose reporter"
            extra+=(--reporter verbose)
          fi
          yarn vitest run --project "${{ matrix.shard }}" "${extra[@]}"

  sdk:
    name: SDK Tests
    needs: cache
    if: needs.cache.outputs.docs_only != 'true' && inputs.run_sdk_tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Restore Yarn cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}
          fail-on-cache-miss: true

      - name: Restore node_modules + toolchain
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}
          fail-on-cache-miss: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r ${{ inputs.framework_root }}/sdks/python/requirements.txt

      - name: TypeScript SDK
        run: yarn test:sdk:typescript

      - name: Python SDK
        run: yarn test:sdk:python

      - name: Rust SDK
        run: yarn test:sdk:rust

  gate:
    name: CI Gate
    if: always()
    needs: [validation, test, sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check results
        run: |
          results=( "${{ needs.validation.result }}" "${{ needs.test.result }}" "${{ needs.sdk.result }}" )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Upstream job failed or was cancelled ($r)"
              exit 1
            fi
          done
