name: CI Reusable

on:
  workflow_call:
    inputs:
      framework_root:
        required: false
        type: string
        default: '.'
        description: 'Path to framework root relative to the repository root.'
      test_shards:
        required: false
        type: string
        default: '["Core", "Packages", "Platform", "Adapters", "Extensions", "Apps", "forks-required"]'
        description: 'JSON array of Vitest project/shard names to run in the test matrix.'
      validation_command:
        required: false
        type: string
        default: 'bun scripts/validate.ts --no-fix --cache --tsconfig tsconfig.json --tools biome,eslint,typescript'
        description: 'Command to run for validation (lint, format, types).'
      run_sdk_tests:
        required: false
        type: boolean
        default: true
        description: 'Whether to run SDK tests (TypeScript, Python, Rust).'
      pr_number:
        required: false
        type: string
        default: ''
        description: 'Pull request number when dispatched through a wrapper workflow.'
      source_sha:
        required: false
        type: string
        default: ''
        description: 'Pull request head SHA when dispatched through a wrapper workflow.'
      base_sha:
        required: false
        type: string
        default: ''
        description: 'Pull request base SHA when dispatched through a wrapper workflow.'
      skip_labels:
        required: false
        type: string
        default: '["skip:ci", "skip:all"]'
        description: 'JSON array of PR labels that skip CI.'
      force_skip_ci:
        required: false
        type: boolean
        default: false
        description: 'Whether to publish a successful CI gate without running CI jobs.'
    outputs:
      docs_only:
        description: 'Whether the PR only changes documentation files.'
        value: ${{ jobs.cache.outputs.docs_only }}

permissions:
  contents: read
  pull-requests: read

env:
  COREPACK_HOME: /tmp/.cache/corepack

jobs:
  precheck:
    name: Precheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_ci: ${{ steps.skip-labels.outputs.skip_ci }}
    steps:
      - name: Check skip labels
        id: skip-labels
        env:
          FORCE_SKIP_CI: ${{ inputs.force_skip_ci }}
          SKIP_LABELS: ${{ inputs.skip_labels }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$FORCE_SKIP_CI" = "true" ]; then
            echo "skip_ci=true" >> "$GITHUB_OUTPUT"
            echo "force_skip_ci input is true; publishing skipped CI gate."
            exit 0
          fi

          skip_ci=false
          configured_labels="$(jq -r 'if type == "array" and all(.[]; type == "string") then .[] else error("skip_labels must be a JSON array of strings") end' <<< "$SKIP_LABELS")"
          while IFS= read -r configured_label; do
            if [ -z "$configured_label" ]; then
              continue
            fi

            if jq -e --arg label "$configured_label" '.pull_request.labels // [] | any(.name == $label)' "$GITHUB_EVENT_PATH" > /dev/null; then
              skip_ci=true
              break
            fi
          done <<< "$configured_labels"

          echo "skip_ci=$skip_ci" >> "$GITHUB_OUTPUT"
          if [ "$skip_ci" = "true" ]; then
            echo "skip CI label found; publishing skipped CI gate."
          fi

  cache:
    name: Cache
    needs: precheck
    if: needs.precheck.outputs.skip_ci != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.event_name == 'pull_request' || inputs.base_sha != ''
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Classify PR changes
        id: changes
        if: github.event_name == 'pull_request' || (inputs.pr_number != '' && inputs.base_sha != '')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          base="$BASE_SHA"
          pr_number="$PR_NUMBER"
          if [ -z "$base" ] || [ -z "$pr_number" ]; then
            echo "::error::PR change classification requires base SHA and PR number."
            exit 1
          fi

          git fetch --no-tags origin "$base"
          git fetch --no-tags origin "refs/pull/${pr_number}/head"

          mapfile -t files < <(git diff --name-only "$base...FETCH_HEAD")
          docs_only=false
          if ((${#files[@]} > 0)); then
            docs_only=true
            for file in "${files[@]}"; do
              if [ "$file" = "docs/package-overview.md" ]; then
                docs_only=false
                break
              fi

              case "$file" in
                *.md|docs/*|.changeset/*.md) ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = "true" ]; then
            echo "Documentation-only PR; skipping CI."
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.event_name != 'pull_request' && inputs.base_sha == '' && steps.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false

      - name: Restore Yarn cache
        if: steps.changes.outputs.docs_only != 'true'
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-${{ runner.os }}-node-24-
            yarn-cache-

      - name: Restore node_modules + toolchain
        if: steps.changes.outputs.docs_only != 'true'
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24

      - name: Enable Corepack
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        env:
          YARN_ENABLE_HARDENED_MODE: '1'
        run: yarn install --immutable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Save Yarn cache
        if: steps.changes.outputs.docs_only != 'true' && steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Save node_modules + toolchain
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}

  validation:
    name: Validation
    needs: cache
    if: needs.cache.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Restore node_modules + toolchain
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies on cache miss
        if: steps.yarn-cache.outputs.cache-hit != 'true' || steps.nm-cache.outputs.cache-hit != 'true'
        env:
          YARN_ENABLE_HARDENED_MODE: '0'
        run: yarn install --immutable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Restore ESLint cache
        id: eslint-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .eslintcache
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs') }}-
            eslint-cache-${{ runner.os }}-

      - name: Check build surface invariants
        run: bun ${{ inputs.framework_root }}/scripts/validate-build-surface.ts

      - name: Run combined validator
        run: ${{ inputs.validation_command }}

      - name: Check package overview drift
        run: bun ${{ inputs.framework_root }}/scripts/validate-package-overview.ts

      - name: Check SDK codegen drift
        run: bun ${{ inputs.framework_root }}/scripts/generate-sdk-bindings.ts --check

      - name: Check CI shard coverage
        run: bun ${{ inputs.framework_root }}/scripts/validate-ci-test-shards.ts

      - name: Save ESLint cache
        if: always() && steps.eslint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .eslintcache
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs') }}-${{ github.sha }}

  test:
    name: Test (${{ matrix.shard }})
    needs: cache
    if: needs.cache.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(inputs.test_shards) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Restore node_modules + toolchain
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies on cache miss
        if: steps.yarn-cache.outputs.cache-hit != 'true' || steps.nm-cache.outputs.cache-hit != 'true'
        env:
          YARN_ENABLE_HARDENED_MODE: '0'
        run: yarn install --immutable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run tests
        run: |
          extra=()
          if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
            echo "::notice::Debug logging active — switching vitest to verbose reporter"
            extra+=(--reporter verbose)
          fi
          yarn vitest run --project "${{ matrix.shard }}" "${extra[@]}"

  test_postgres:
    name: Test (storage-postgres)
    needs: cache
    if: needs.cache.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: makaio_storage_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Restore node_modules + toolchain
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies on cache miss
        if: steps.yarn-cache.outputs.cache-hit != 'true' || steps.nm-cache.outputs.cache-hit != 'true'
        env:
          YARN_ENABLE_HARDENED_MODE: '0'
        run: yarn install --immutable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run storage conformance against Postgres
        # The Vitest config and the storage/conformance path filter live at the
        # framework root, so the step must run from inputs.framework_root.
        working-directory: ${{ inputs.framework_root }}
        env:
          MAKAIO_STORAGE_TEST_DIALECT: postgres
          MAKAIO_STORAGE_TEST_URL: postgres://postgres:postgres@localhost:5432/makaio_storage_conformance
        run: |
          if [ -z "${MAKAIO_STORAGE_TEST_DIALECT}" ] || [ -z "${MAKAIO_STORAGE_TEST_URL}" ]; then
            echo "::error::Storage conformance Postgres environment is not configured."
            exit 1
          fi
          yarn vitest run --project Core storage/conformance

  # Builds the @makaio/framework distribution and runs the embedded dist
  # verifier, including the invariant that the core artifact contains no
  # Postgres driver or engine code (that code ships exclusively with
  # @makaio/storage-pg).
  framework_dist:
    name: Framework Dist
    needs: cache
    if: needs.cache.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Restore node_modules + toolchain
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies on cache miss
        if: steps.yarn-cache.outputs.cache-hit != 'true' || steps.nm-cache.outputs.cache-hit != 'true'
        env:
          YARN_ENABLE_HARDENED_MODE: '0'
        run: yarn install --immutable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Build the framework distribution
        # The build:framework script lives at the framework root, so the step
        # must run from inputs.framework_root.
        working-directory: ${{ inputs.framework_root }}
        run: NODE_OPTIONS=--max-old-space-size=4096 yarn build:framework

  sdk:
    name: SDK Tests
    needs: cache
    if: needs.cache.outputs.docs_only != 'true' && inputs.run_sdk_tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Restore node_modules + toolchain
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies on cache miss
        if: steps.yarn-cache.outputs.cache-hit != 'true' || steps.nm-cache.outputs.cache-hit != 'true'
        env:
          YARN_ENABLE_HARDENED_MODE: '0'
        run: yarn install --immutable

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r ${{ inputs.framework_root }}/sdks/python/requirements.txt

      - name: TypeScript SDK
        run: yarn test:sdk:typescript

      - name: Python SDK
        run: yarn test:sdk:python

      - name: Rust SDK
        run: yarn test:sdk:rust

  gate:
    name: CI Gate
    if: always()
    needs: [precheck, validation, test, test_postgres, framework_dist, sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.precheck.result }}" == "failure" || "${{ needs.precheck.result }}" == "cancelled" ]]; then
            echo "::error::Precheck failed or was cancelled (${{ needs.precheck.result }})"
            exit 1
          fi

          if [[ "${{ needs.precheck.outputs.skip_ci }}" == "true" ]]; then
            echo "::notice::CI skipped by label policy."
            exit 0
          fi

          results=( "${{ needs.validation.result }}" "${{ needs.test.result }}" "${{ needs.test_postgres.result }}" "${{ needs.framework_dist.result }}" "${{ needs.sdk.result }}" )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Upstream job failed or was cancelled ($r)"
              exit 1
            fi
          done
