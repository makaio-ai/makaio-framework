name: Changeset Required Reusable

on:
  workflow_call:
    inputs:
      framework_root:
        required: false
        type: string
        default: '.'
        description: 'Path to the framework root relative to the repository root.'

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset-required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0

      - name: Check for skip labels
        id: skip
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const labels = context.payload.pull_request?.labels ?? [];
            const skip = labels.some(l => ['skip:changeset', 'skip:ci', 'skip:all'].includes(l.name));
            core.setOutput('skip', skip ? 'true' : 'false');
            if (skip) core.info('skip label found — skipping changeset check.');

      - name: Fetch PR head
        if: steps.skip.outputs.skip != 'true'
        run: git fetch --no-tags "${{ github.event.pull_request.head.repo.clone_url }}" "${{ github.event.pull_request.head.sha }}"
        working-directory: trusted

      - name: Detect package release changeset
        id: head_changeset
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          framework_root="${{ inputs.framework_root }}"
          if [ "$framework_root" = "." ]; then
            changeset_prefix=".changeset/"
          else
            changeset_prefix="${framework_root%/}/.changeset/"
          fi

          present=false
          while IFS= read -r file; do
            case "$file" in
              "$changeset_prefix"*.md)
                remainder="${file#$changeset_prefix}"
                if [[ "$remainder" != */* ]]; then
                  present=true
                  break
                fi
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          echo "present=$present" >> "$GITHUB_OUTPUT"
          if [ "$present" = "true" ]; then
            echo "::notice::Package release changeset found at ${changeset_prefix}*.md."
          fi
        working-directory: trusted

      - name: Resolve trusted checker
        id: checker
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail

          framework_root="${{ inputs.framework_root }}"
          if [ "$framework_root" = "." ]; then
            checker_path="scripts/changeset-required.ts"
          else
            checker_path="${framework_root%/}/scripts/changeset-required.ts"
          fi

          if [ -f "$checker_path" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "path=$checker_path" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if ! git cat-file -e "$base:$checker_path" 2>/dev/null && git cat-file -e "$head:$checker_path" 2>/dev/null; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Trusted changeset checker is being introduced by this PR; skipping the bootstrap check for this run."
            exit 0
          fi

          echo "::error::Trusted changeset checker is missing from the base checkout at $checker_path."
          exit 1
        working-directory: trusted

      - name: Setup Node
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true' && steps.checker.outputs.available == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true' && steps.checker.outputs.available == 'true'
        run: corepack enable

      - name: Restore Yarn cache
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true' && steps.checker.outputs.available == 'true'
        id: yarn-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            trusted/.yarn/cache
            trusted/.yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('trusted/yarn.lock') }}
          restore-keys: yarn-cache-

      - name: Restore node_modules
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true' && steps.checker.outputs.available == 'true'
        id: nm-cache
        uses: actions/cache/restore@v5
        with:
          path: "trusted/**/node_modules"
          key: node-modules-v3-${{ hashFiles('trusted/yarn.lock') }}

      - name: Install dependencies
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true' && steps.checker.outputs.available == 'true'
        run: yarn install --immutable
        working-directory: trusted

      - name: Save Yarn cache
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true' && steps.checker.outputs.available == 'true' && steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            trusted/.yarn/cache
            trusted/.yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('trusted/yarn.lock') }}

      - name: Save node_modules
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true' && steps.checker.outputs.available == 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: "trusted/**/node_modules"
          key: node-modules-v3-${{ hashFiles('trusted/yarn.lock') }}

      - name: Check changeset
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true' && steps.checker.outputs.available == 'true'
        run: |
          yarn tsx "${{ steps.checker.outputs.path }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
        working-directory: trusted
