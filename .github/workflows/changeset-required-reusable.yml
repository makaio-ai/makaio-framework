name: Changeset Required Reusable

on:
  workflow_call:
    inputs:
      framework_root:
        required: false
        type: string
        default: '.'
        description: 'Path to the framework root relative to the repository root.'

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset-required:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0

      - name: Check for skip labels
        id: skip
        shell: bash
        run: |
          set -euo pipefail

          skip=false
          for label in "skip:changeset" "skip:ci" "skip:all"; do
            if jq -e --arg label "$label" '.pull_request.labels // [] | any(.name == $label)' "$GITHUB_EVENT_PATH" > /dev/null; then
              skip=true
              break
            fi
          done

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then
            echo "skip label found — skipping changeset check."
          fi

      - name: Fetch PR head
        if: steps.skip.outputs.skip != 'true'
        run: git fetch --no-tags "${{ github.event.pull_request.head.repo.clone_url }}" "${{ github.event.pull_request.head.sha }}"
        working-directory: trusted

      - name: Detect package release changeset
        id: head_changeset
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          framework_root="${{ inputs.framework_root }}"
          if [ "$framework_root" = "." ]; then
            changeset_prefix=".changeset/"
          else
            changeset_prefix="${framework_root%/}/.changeset/"
          fi

          present=false
          while IFS= read -r file; do
            case "$file" in
              "$changeset_prefix"*.md)
                remainder="${file#$changeset_prefix}"
                if [[ "$remainder" != */* ]]; then
                  present=true
                  break
                fi
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          echo "present=$present" >> "$GITHUB_OUTPUT"
          if [ "$present" = "true" ]; then
            echo "::notice::Package release changeset found at ${changeset_prefix}*.md."
          fi
        working-directory: trusted

      - name: Classify publish relevance
        id: publish_relevance
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          framework_root="${{ inputs.framework_root }}"
          relevant=false

          while IFS= read -r file; do
            if [ "$framework_root" != "." ]; then
              case "$file" in
                "${framework_root%/}/"*) file="${file#"${framework_root%/}/"}" ;;
                *) continue ;;
              esac
            fi

            case "$file" in
              .github/*|docs/*|scripts/*|.changeset/*.md|*.md) continue ;;
            esac

            case "${file##*/}" in
              bun.lock|bun.lockb|Cargo.lock|package-lock.json|pnpm-lock.yaml|yarn.lock) continue ;;
            esac

            if [[ "${file##*/}" =~ \.(snap|(test|spec)\.[cm]?[jt]sx?)$ ]]; then
              continue
            fi

            case "$file" in
              __tests__/*|*/__tests__/*|fixtures/*|*/fixtures/*|snapshots/*|*/snapshots/*) continue ;;
            esac

            relevant=true
            break
          done < <(git diff --name-only --diff-filter=d "$base...$head")

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" = "false" ]; then
            echo "::notice::No publish-relevant files changed; skipping dependency install and changeset check."
          fi
        working-directory: trusted

      - name: Resolve trusted checker
        id: checker
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true' && steps.publish_relevance.outputs.relevant != 'false'
        shell: bash
        run: |
          set -euo pipefail

          framework_root="${{ inputs.framework_root }}"
          if [ "$framework_root" = "." ]; then
            checker_path="scripts/changeset-required.ts"
          else
            checker_path="${framework_root%/}/scripts/changeset-required.ts"
          fi

          if [ -f "$checker_path" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "path=$checker_path" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if ! git cat-file -e "$base:$checker_path" 2>/dev/null && git cat-file -e "$head:$checker_path" 2>/dev/null; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Trusted changeset checker is being introduced by this PR; skipping the bootstrap check for this run."
            exit 0
          fi

          echo "::error::Trusted changeset checker is missing from the base checkout at $checker_path."
          exit 1
        working-directory: trusted

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true' && steps.publish_relevance.outputs.relevant != 'false' && steps.checker.outputs.available == 'true'

      - name: Check changeset
        if: steps.skip.outputs.skip != 'true' && steps.head_changeset.outputs.present != 'true' && steps.publish_relevance.outputs.relevant != 'false' && steps.checker.outputs.available == 'true'
        run: |
          bun "${{ steps.checker.outputs.path }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
        working-directory: trusted
