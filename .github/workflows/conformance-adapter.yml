name: Conformance Adapter

on:
  workflow_call:
    inputs:
      adapter:
        required: true
        type: string
      provider_env_var:
        required: false
        type: string
        default: ''
      provider_secret_name:
        required: false
        type: string
        default: ''
      conformance_provider:
        required: false
        type: string
        default: ''
      primary_model:
        required: false
        type: string
        default: ''
      secondary_model:
        required: false
        type: string
        default: ''
      environment:
        required: true
        type: string
      pr_ref:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    name: conformance (${{ inputs.adapter }})
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.pr_ref || '' }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Restore Yarn cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-

      - name: Restore node_modules
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: "**/node_modules"
          key: node-modules-v3-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install adapter CLI
        uses: ./.github/actions/install-conformance-cli
        with:
          adapter: ${{ inputs.adapter }}

      - name: Run adapter smoke
        env:
          PROVIDER_SECRET_NAME: ${{ inputs.provider_secret_name || vars.PROVIDER_SECRET_NAME }}
          PROVIDER_ENV_VAR: ${{ inputs.provider_env_var || vars.PROVIDER_ENV_VAR }}
          PROVIDER_API_KEY: ${{ secrets[inputs.provider_secret_name || vars.PROVIDER_SECRET_NAME] }}
          MAKAIO_CONFORMANCE_PROVIDER: ${{ inputs.conformance_provider || vars.MAKAIO_CONFORMANCE_PROVIDER }}
          MAKAIO_CONFORMANCE_PRIMARY_MODEL: ${{ inputs.primary_model || vars.MAKAIO_CONFORMANCE_PRIMARY_MODEL }}
          MAKAIO_CONFORMANCE_SECONDARY_MODEL: ${{ inputs.secondary_model || vars.MAKAIO_CONFORMANCE_SECONDARY_MODEL }}
          MAKAIO_CONFORMANCE_LOG_DIR: conformance-artifacts/logs
          TMPDIR: conformance-artifacts/logs
        run: |
          if [ -z "${PROVIDER_SECRET_NAME}" ]; then
            echo "::error::Missing provider secret name for adapter '${{ inputs.adapter }}'. Set input provider_secret_name or environment variable PROVIDER_SECRET_NAME."
            exit 1
          fi
          if [ -z "${PROVIDER_ENV_VAR}" ]; then
            echo "::error::Missing provider environment variable for adapter '${{ inputs.adapter }}'. Set input provider_env_var or environment variable PROVIDER_ENV_VAR."
            exit 1
          fi
          if [ -z "${PROVIDER_API_KEY}" ]; then
            echo "::error::Missing secret '${PROVIDER_SECRET_NAME}' for adapter '${{ inputs.adapter }}'"
            exit 1
          fi
          export "${PROVIDER_ENV_VAR}=${PROVIDER_API_KEY}"
          mkdir -p conformance-artifacts/logs
          yarn test:conformance \
            -a ${{ inputs.adapter }} \
            agents.simple.test.ts \
            orchestration/sendMessage.test.ts \
            --workers 1 \
            --phase adapter-smoke \
            --result-output conformance-artifacts/conformance-result-${{ inputs.adapter }}-adapter-smoke.json \
            --schema-violations-output conformance-artifacts/schema-violations-${{ inputs.adapter }}-adapter-smoke.json

      - name: Run adapter rest
        env:
          PROVIDER_SECRET_NAME: ${{ inputs.provider_secret_name || vars.PROVIDER_SECRET_NAME }}
          PROVIDER_ENV_VAR: ${{ inputs.provider_env_var || vars.PROVIDER_ENV_VAR }}
          PROVIDER_API_KEY: ${{ secrets[inputs.provider_secret_name || vars.PROVIDER_SECRET_NAME] }}
          MAKAIO_CONFORMANCE_PROVIDER: ${{ inputs.conformance_provider || vars.MAKAIO_CONFORMANCE_PROVIDER }}
          MAKAIO_CONFORMANCE_PRIMARY_MODEL: ${{ inputs.primary_model || vars.MAKAIO_CONFORMANCE_PRIMARY_MODEL }}
          MAKAIO_CONFORMANCE_SECONDARY_MODEL: ${{ inputs.secondary_model || vars.MAKAIO_CONFORMANCE_SECONDARY_MODEL }}
          MAKAIO_CONFORMANCE_LOG_DIR: conformance-artifacts/logs
          TMPDIR: conformance-artifacts/logs
        run: |
          if [ -z "${PROVIDER_SECRET_NAME}" ]; then
            echo "::error::Missing provider secret name for adapter '${{ inputs.adapter }}'. Set input provider_secret_name or environment variable PROVIDER_SECRET_NAME."
            exit 1
          fi
          if [ -z "${PROVIDER_ENV_VAR}" ]; then
            echo "::error::Missing provider environment variable for adapter '${{ inputs.adapter }}'. Set input provider_env_var or environment variable PROVIDER_ENV_VAR."
            exit 1
          fi
          if [ -z "${PROVIDER_API_KEY}" ]; then
            echo "::error::Missing secret '${PROVIDER_SECRET_NAME}' for adapter '${{ inputs.adapter }}'"
            exit 1
          fi
          export "${PROVIDER_ENV_VAR}=${PROVIDER_API_KEY}"
          mkdir -p conformance-artifacts/logs
          yarn test:conformance \
            -a ${{ inputs.adapter }} \
            --exclude agents.simple.test.ts \
            --exclude orchestration/sendMessage.test.ts \
            --phase adapter-rest \
            --result-output conformance-artifacts/conformance-result-${{ inputs.adapter }}-adapter-rest.json \
            --schema-violations-output conformance-artifacts/schema-violations-${{ inputs.adapter }}-adapter-rest.json

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-artifacts-${{ inputs.adapter }}
          path: conformance-artifacts/**
          if-no-files-found: ignore
