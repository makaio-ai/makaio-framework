name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Add skip:changeset label
        run: gh pr edit "$PR_URL" --add-label "skip:changeset"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check for adapter dependency group
        id: adapter-check
        shell: bash
        run: |
          group="${{ steps.metadata.outputs.dependency-group }}"
          if [[ "$group" == adapter-* ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping auto-merge — adapter dependency group: $group"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-merge patch and minor updates
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.adapter-check.outputs.blocked != 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
