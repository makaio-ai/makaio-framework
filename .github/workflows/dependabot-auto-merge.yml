name: Dependabot labels

on:
  pull_request:

permissions:
  # contents: write is kept for the "Turn off auto-merge" step: GitHub's documentation
  # does not state which permissions the disablePullRequestAutoMerge mutation needs,
  # and enabling auto-merge required contents: write.
  contents: write
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      # Pull requests that had auto-merge enabled by the former auto-merge step keep it
      # until it is turned off explicitly. `gh pr merge --disable-auto` does not document
      # its behaviour when auto-merge is off, so the step checks first.
      - name: Turn off auto-merge
        run: |
          if [[ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge --disable-auto "$PR_URL"
          else
            echo "Auto-merge is not enabled."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add skip:changeset label
        run: gh pr edit "$PR_URL" --add-label "skip:changeset"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check for adapter SDK dependencies
        id: adapter-sdk-check
        shell: bash
        env:
          UPDATED_DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          adapter_sdk_names="$(
            jq -r '
              .[]
              | (.dependencyName // .dependency_name // .["dependency-name"] // empty)
              | select(
                  . == "openai" or
                  startswith("@agentclientprotocol/") or
                  startswith("@anthropic-ai/") or
                  startswith("@mariozechner/pi-") or
                  startswith("@modelcontextprotocol/")
                )
            ' <<< "$UPDATED_DEPENDENCIES_JSON"
          )"

          if [[ -n "$adapter_sdk_names" ]]; then
            {
              echo "matched=true"
              echo "dependencies<<EOF"
              echo "$adapter_sdk_names"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Adapter SDK dependency update: $adapter_sdk_names"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Label adapter SDK updates
        if: steps.adapter-sdk-check.outputs.matched == 'true'
        run: |
          gh label create "adapter-sdk" --description "External SDK used by adapter implementations" --color "5319E7" --force
          gh label create "needs:conformance-tests" --description "Requires adapter conformance test coverage before merge" --color "D93F0B" --force
          gh pr edit "$PR_URL" --add-label "adapter-sdk,needs:conformance-tests"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
