name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUN_VERSION: 1.3.12

jobs:
  ci:
    name: Validate, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Python SDK dependencies
        run: python -m pip install --disable-pip-version-check -r sdks/python/requirements.txt

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Validate (typecheck + lint + format)
        run: yarn validate

      - name: Unit tests
        run: yarn test

      - name: SDK tests
        run: yarn test:sdk

      - name: Runtime E2E tests
        run: yarn test:e2e

      - name: Build framework packages
        # Intentional: this workspace includes helper/apps packages that are
        # source-only in the standalone repo. CI builds every package that
        # declares a build script instead of turning missing optional scripts
        # into hard failures.
        run: yarn workspaces foreach -A --topological --parallel --if-present run build
