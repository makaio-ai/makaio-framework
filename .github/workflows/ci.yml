name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.12

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Prettier Validation
            command: yarn validate:prettier
          - name: ESLint Validation
            command: yarn validate:eslint
          - name: Stylelint Validation
            command: yarn validate:stylelint
          - name: TypeScript Validation
            command: yarn validate:typescript
          - name: Unit Tests
            command: yarn test
            setup_bun: true
          - name: TypeScript SDK Tests
            command: yarn test:sdk:typescript
          - name: Python SDK Tests
            command: yarn test:sdk:python
            setup_python: true
          - name: Rust SDK Tests
            command: yarn test:sdk:rust
            setup_rust: true
          - name: Browser E2E
            command: yarn test:e2e:browser
            setup_playwright: true
          - name: CLI E2E
            command: yarn test:e2e:cli
            setup_bun: true
          - name: Desktop E2E
            command: ELECTRON_EXTRA_LAUNCH_ARGS=--no-sandbox xvfb-run --auto-servernum yarn test:e2e:desktop
            setup_bun: true
          - name: Electron E2E
            command: ELECTRON_EXTRA_LAUNCH_ARGS=--no-sandbox xvfb-run --auto-servernum yarn test:e2e:electron
            setup_bun: true
          - name: Electron Playwright E2E
            command: ELECTRON_EXTRA_LAUNCH_ARGS=--no-sandbox xvfb-run --auto-servernum yarn test:e2e:electron-pw
            setup_bun: true
            setup_playwright: true
          - name: Framework Build
            command: yarn workspaces foreach -A --topological --parallel run build
            setup_bun: true
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - uses: oven-sh/setup-bun@v2
        if: matrix.setup_bun == true
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-python@v6
        if: matrix.setup_python == true
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.setup_rust == true

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-

      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache/restore@v5
        with:
          path: '**/node_modules'
          key: node-modules-v3-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Save Yarn cache
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}

      - name: Save node_modules
        if: steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: '**/node_modules'
          key: node-modules-v3-${{ hashFiles('yarn.lock') }}

      - name: Install Python SDK dependencies
        if: matrix.setup_python == true
        run: python -m pip install --disable-pip-version-check -r sdks/python/requirements.txt

      - name: Install Playwright browsers
        if: matrix.setup_playwright == true
        run: yarn playwright install --with-deps chromium chromium-headless-shell

      - name: Restore ESLint cache
        if: matrix.name == 'ESLint Validation'
        id: eslint-cache
        uses: actions/cache/restore@v5
        with:
          path: .eslintcache
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs', 'scripts/eslint-base.mjs') }}
          restore-keys: eslint-cache-${{ runner.os }}-

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Save ESLint cache
        if: matrix.name == 'ESLint Validation' && steps.eslint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .eslintcache
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs', 'scripts/eslint-base.mjs') }}
