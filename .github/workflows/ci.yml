name: PR - CI

run-name: >-
  ${{ inputs.skip_ci == 'true' && format('Skip PR - CI for #{0}', inputs.pr_number) || github.event.pull_request.title || format('PR - CI {0}', github.ref_name) }}

on:
  push:
    branches: [fix/ci]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number when dispatched by CI Label Controller.
        required: false
        type: string
      source_sha:
        description: Pull request head SHA when dispatched by CI Label Controller.
        required: false
        type: string
      skip_ci:
        description: Set to true to publish a lightweight skipped CI result.
        required: false
        default: 'false'
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: inputs.skip_ci != 'true'
    uses: ./.github/workflows/ci-reusable.yml
    with:
      test_shards: '["Core", "Packages", "Platform", "Adapters", "Extensions", "Apps"]'
      validation_command: 'bun scripts/validate.ts --no-fix --cache --tsconfig tsconfig.json'
      run_sdk_tests: true

  skipped:
    name: CI Gate
    if: inputs.skip_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "CI skipped by label controller."
