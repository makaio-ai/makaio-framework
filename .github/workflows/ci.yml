name: CI

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch, tag, or SHA to check out.
        required: false
        type: string
      source_sha:
        description: Expected commit SHA after checkout.
        required: false
        type: string
      pr_number:
        description: Pull request number used for concurrency grouping.
        required: false
        type: string
  repository_dispatch:
    types: [full-ci-requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.client_payload.pr_number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.12
  CHECKOUT_REF: ${{ github.event.client_payload.checkout_ref || inputs.checkout_ref || github.ref }}
  SOURCE_SHA: ${{ github.event.client_payload.source_sha || inputs.source_sha }}
  REUSE_QUICK_VALIDATION: ${{ github.event.client_payload.reuse_quick_validation || false }}

jobs:
  ci:
    if: github.event.client_payload.skip_ci != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Biome Validation
            command: yarn validate:biome
            validation: true
          - name: ESLint Validation
            command: yarn validate:eslint
            validation: true
          - name: Stylelint Validation
            command: yarn validate:stylelint
            validation: true
          - name: TypeScript Validation
            command: yarn validate:typescript
            validation: true
          - name: SDK Codegen Drift
            command: yarn validate:sdk-codegen
            validation: true
          - name: Unit Tests
            command: yarn test
            setup_bun: true
          - name: TypeScript SDK Tests
            command: yarn test:sdk:typescript
          - name: Python SDK Tests
            command: yarn test:sdk:python
            setup_python: true
          - name: Rust SDK Tests
            command: yarn test:sdk:rust
            setup_rust: true
          - name: Browser E2E
            command: yarn test:e2e:browser
            setup_playwright: true
          - name: CLI E2E
            command: yarn test:e2e:cli
            setup_bun: true
          - name: Desktop E2E
            command: ELECTRON_EXTRA_LAUNCH_ARGS=--no-sandbox xvfb-run --auto-servernum yarn test:e2e:desktop
            setup_bun: true
          - name: Electron E2E
            command: ELECTRON_EXTRA_LAUNCH_ARGS=--no-sandbox xvfb-run --auto-servernum yarn test:e2e:electron
            setup_bun: true
          - name: Electron Playwright E2E
            command: ELECTRON_EXTRA_LAUNCH_ARGS=--no-sandbox xvfb-run --auto-servernum yarn test:e2e:electron-pw
            setup_bun: true
            setup_playwright: true
          - name: Framework Build
            command: yarn build:framework
            setup_bun: true
          - name: Extension Build
            command: yarn build:framework && yarn build:extensions
            setup_bun: true
    name: ${{ matrix.name }}

    steps:
      - name: Skip reused validation
        if: env.REUSE_QUICK_VALIDATION == 'true' && matrix.validation == true
        run: |
          echo "Validation reused from Quick Checks for ${SOURCE_SHA}."
          echo "Quick Checks: ${{ github.event.client_payload.quick_check_url }}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Verify checked out source
        if: (env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true) && env.SOURCE_SHA != ''
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Checked out $ACTUAL_SHA, expected $SOURCE_SHA"
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true
        with:
          node-version: 24

      - name: Enable Corepack
        if: env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true
        run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: (env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true) && matrix.setup_bun == true
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        if: (env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true) && matrix.setup_python == true
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: (env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true) && matrix.setup_rust == true

      - name: Restore Yarn cache
        if: env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-

      - name: Restore node_modules
        if: env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: '**/node_modules'
          key: node-modules-v4-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true
        run: yarn install --immutable

      - name: Save Yarn cache
        if: (env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true) && steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}

      - name: Save node_modules
        if: (env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true) && steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: '**/node_modules'
          key: node-modules-v4-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Install Python SDK dependencies
        if: (env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true) && matrix.setup_python == true
        run: python -m pip install --disable-pip-version-check -r sdks/python/requirements.txt

      - name: Install Playwright browsers
        if: (env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true) && matrix.setup_playwright == true
        run: yarn playwright install --with-deps chromium chromium-headless-shell

      - name: Restore ESLint cache
        if: (env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true) && matrix.name == 'ESLint Validation'
        id: eslint-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .eslintcache
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs', 'scripts/eslint-base.mjs') }}
          restore-keys: eslint-cache-${{ runner.os }}-

      - name: ${{ matrix.name }}
        if: env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true
        run: ${{ matrix.command }}

      - name: Save ESLint cache
        if: (env.REUSE_QUICK_VALIDATION != 'true' || matrix.validation != true) && matrix.name == 'ESLint Validation' && steps.eslint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .eslintcache
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs', 'scripts/eslint-base.mjs') }}

  codeql:
    if: github.event.client_payload.skip_ci != true
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Verify checked out source
        if: env.SOURCE_SHA != ''
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Checked out $ACTUAL_SHA, expected $SOURCE_SHA"
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        with:
          category: full-ci/${{ matrix.language }}
