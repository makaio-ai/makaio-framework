name: PR - CI

run-name: >-
  ${{
    (
      inputs.skip_ci == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'skip:ci') ||
      contains(github.event.pull_request.labels.*.name, 'skip:all')
    ) &&
    format('Skip PR - CI for #{0}', github.event.pull_request.number || inputs.pr_number) ||
    github.event.pull_request.title ||
    format('PR - CI {0}', github.ref_name)
  }}

on:
  push:
    branches: [fix/ci]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number when dispatched by CI Label Controller.
        required: false
        type: string
      source_sha:
        description: Pull request head SHA when dispatched by CI Label Controller.
        required: false
        type: string
      base_sha:
        description: Pull request base SHA when dispatched by CI Label Controller.
        required: false
        type: string
      skip_ci:
        description: Set to true to publish a lightweight skipped CI result.
        required: false
        default: 'false'
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      test_shards: '["Core", "Packages", "Platform", "Adapters", "Extensions", "Apps"]'
      validation_command: 'bun scripts/validate.ts --no-fix --cache --tsconfig tsconfig.json'
      run_sdk_tests: true
      pr_number: ${{ inputs.pr_number }}
      source_sha: ${{ inputs.source_sha }}
      base_sha: ${{ inputs.base_sha }}
      force_skip_ci: ${{ inputs.skip_ci == 'true' }}
