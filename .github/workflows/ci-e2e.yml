name: PR E2E Tests

run-name: >-
  ${{ inputs.skip_e2e == 'true' && format('Skip PR E2E Tests for #{0}', inputs.pr_number) || github.event.pull_request.title || format('PR E2E Tests {0}', github.ref_name) }}

on:
  push:
    branches: [fix/ci]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number when dispatched by CI Label Controller.
        required: false
        type: string
      source_sha:
        description: Pull request head SHA when dispatched by CI Label Controller.
        required: false
        type: string
      base_sha:
        description: Pull request base SHA when dispatched by CI Label Controller.
        required: false
        type: string
      skip_e2e:
        description: Set to true to publish a lightweight skipped E2E result.
        required: false
        default: 'false'
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-e2e-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  COREPACK_HOME: /tmp/.cache/corepack

jobs:
  cache:
    name: Cache
    if: >-
      inputs.skip_e2e != 'true' &&
      (
        github.event_name != 'pull_request' ||
        (
          !contains(github.event.pull_request.labels.*.name, 'skip:ci') &&
          !contains(github.event.pull_request.labels.*.name, 'skip:all') &&
          !contains(github.event.pull_request.labels.*.name, 'skip:e2e')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: github.event_name == 'pull_request' || inputs.base_sha != ''
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Classify PR changes
        id: changes
        if: github.event_name == 'pull_request' || (inputs.pr_number != '' && inputs.base_sha != '')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          base="$BASE_SHA"
          pr_number="$PR_NUMBER"
          if [ -z "$base" ] || [ -z "$pr_number" ]; then
            echo "::error::PR change classification requires base SHA and PR number."
            exit 1
          fi

          git fetch --no-tags origin "$base"
          git fetch --no-tags origin "refs/pull/${pr_number}/head"

          mapfile -t files < <(git diff --name-only "$base...FETCH_HEAD")
          docs_only=false
          if ((${#files[@]} > 0)); then
            docs_only=true
            for file in "${files[@]}"; do
              case "$file" in
                *.md|docs/*|.changeset/*.md) ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = "true" ]; then
            echo "Documentation-only PR; skipping E2E."
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: github.event_name != 'pull_request' && inputs.base_sha == '' && steps.changes.outputs.docs_only != 'true'
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Restore Yarn cache
        if: steps.changes.outputs.docs_only != 'true'
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-${{ runner.os }}-node-24-
            yarn-cache-

      - name: Restore node_modules + toolchain
        if: steps.changes.outputs.docs_only != 'true'
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24

      - name: Enable Corepack
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Save Yarn cache
        if: steps.changes.outputs.docs_only != 'true' && steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Save node_modules + toolchain
        if: steps.changes.outputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}

  cli:
    name: CLI E2E
    needs: cache
    if: needs.cache.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Restore Yarn cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}
          fail-on-cache-miss: true

      - name: Restore node_modules + toolchain
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}
          fail-on-cache-miss: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run CLI E2E tests
        run: yarn test:e2e:cli

  desktop:
    name: Desktop E2E (Electrobun)
    needs: cache
    if: needs.cache.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Must exceed the fixture-build budgets in launcher-smoke.test.ts (framework
    # 600s + launcher 120s + hook margin) plus job setup and the sibling desktop
    # suite. Those budgets are hang-detection ceilings that attribute a timeout
    # to the named build step; if this outer timeout is smaller, the runner is
    # killed before that diagnostic can surface. A normal run finishes in a
    # fraction of this.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Restore Yarn cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}
          fail-on-cache-miss: true

      - name: Restore node_modules + toolchain
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}
          fail-on-cache-miss: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Electrobun system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run Desktop E2E tests
        run: xvfb-run --auto-servernum yarn test:e2e:desktop

  browser:
    name: Browser E2E
    needs: cache
    if: needs.cache.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Restore Yarn cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}
          fail-on-cache-miss: true

      - name: Restore node_modules + toolchain
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            **/node_modules
            /tmp/.cache/corepack
          key: node-modules-v5-${{ runner.os }}-node-24-corepack-${{ hashFiles('yarn.lock', 'package.json') }}
          fail-on-cache-miss: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium chromium-headless-shell

      - name: Run Browser E2E tests
        run: yarn test:e2e:browser
