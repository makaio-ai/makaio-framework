name: Conformance Tests Reusable

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      comment_id:
        required: true
        type: number
      comment_body:
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: conformance-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      adapter_matrix: ${{ steps.command.outputs.adapter_matrix }}
      has_adapter_jobs: ${{ steps.command.outputs.has_adapter_jobs }}
      openai_enabled: ${{ steps.command.outputs.openai_enabled }}
      openai_provider_env_var: ${{ steps.command.outputs.openai_provider_env_var }}
      openai_provider_secret_name: ${{ steps.command.outputs.openai_provider_secret_name }}
      openai_conformance_provider: ${{ steps.command.outputs.openai_conformance_provider }}
      openai_primary_model: ${{ steps.command.outputs.openai_primary_model }}
      openai_secondary_model: ${{ steps.command.outputs.openai_secondary_model }}
    steps:
      # Resolve PR metadata before checking out code that will receive provider
      # API keys.
      - name: Reject fork pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ inputs.pr_number }},
            });

            const baseRepository = `${context.repo.owner}/${context.repo.repo}`;
            const headRepository = pullRequest.head.repo?.full_name;

            if (headRepository !== baseRepository) {
              core.setFailed(
                'Conformance tests require provider API keys and only run for pull requests from this repository.',
              );
            }

      - name: Parse conformance command
        id: command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const adapterConfigs = {
              'openai-node': {
                adapter: 'openai-node',
                provider_env_var: 'OPENCODE_GO_API_KEY',
                provider_secret_name: 'OPENCODE_GO_API_KEY',
                conformance_provider: 'opencode-go',
                primary_model: '',
                secondary_model: '',
              },
              'anthropic-sdk': {
                adapter: 'anthropic-sdk',
                provider_env_var: 'OPENCODE_GO_API_KEY',
                provider_secret_name: 'OPENCODE_GO_API_KEY',
                conformance_provider: 'opencode-go-anthropic',
                primary_model: '',
                secondary_model: '',
              },
              'claude-agent-sdk': {
                adapter: 'claude-agent-sdk',
                provider_env_var: 'OPENCODE_GO_API_KEY',
                provider_secret_name: 'OPENCODE_GO_API_KEY',
                conformance_provider: 'opencode-go-anthropic',
                primary_model: '',
                secondary_model: '',
              },
              'claude-code-cli': {
                adapter: 'claude-code-cli',
                provider_env_var: 'OPENCODE_GO_API_KEY',
                provider_secret_name: 'OPENCODE_GO_API_KEY',
                conformance_provider: 'opencode-go-anthropic',
                primary_model: '',
                secondary_model: '',
              },
              'codex-app-server': {
                adapter: 'codex-app-server',
                provider_env_var: 'CODEX_ACCESS_TOKEN',
                provider_secret_name: 'CODEX_ACCESS_TOKEN',
                conformance_provider: '',
                primary_model: '',
                secondary_model: '',
              },
              'gemini-sdk': {
                adapter: 'gemini-sdk',
                provider_env_var: 'GEMINI_API_KEY',
                provider_secret_name: 'GEMINI_API_KEY',
                conformance_provider: '',
                primary_model: '',
                secondary_model: '',
              },
              'pi-sdk': {
                adapter: 'pi-sdk',
                provider_env_var: 'OPENCODE_GO_API_KEY',
                provider_secret_name: 'OPENCODE_GO_API_KEY',
                conformance_provider: 'opencode-go',
                primary_model: '',
                secondary_model: '',
              },
            };

            const body = process.env.COMMENT_BODY.trim();
            const parts = body.split(/\s+/).filter(Boolean);
            if (parts[0] !== '/conformance') {
              core.setFailed(`Unsupported conformance command: ${body}`);
              return;
            }

            let target = 'all';
            let overrideStart = 1;
            if (parts[1] && !parts[1].includes('=')) {
              target = parts[1];
              overrideStart = 2;
            }

            const allowedTargets = new Set(['all', ...Object.keys(adapterConfigs)]);
            if (!allowedTargets.has(target)) {
              core.setFailed(`Unknown conformance adapter '${target}'. Available: all, ${Object.keys(adapterConfigs).join(', ')}`);
              return;
            }

            const overrides = {};
            const aliases = {
              provider: 'conformance_provider',
              conformance_provider: 'conformance_provider',
              secret: 'provider_secret_name',
              provider_secret_name: 'provider_secret_name',
              env: 'provider_env_var',
              provider_env_var: 'provider_env_var',
              primary: 'primary_model',
              primary_model: 'primary_model',
              secondary: 'secondary_model',
              secondary_model: 'secondary_model',
            };

            for (const token of parts.slice(overrideStart)) {
              const separator = token.indexOf('=');
              if (separator <= 0) {
                core.setFailed(`Invalid conformance override '${token}'. Expected key=value.`);
                return;
              }
              const key = token.slice(0, separator);
              const value = token.slice(separator + 1);
              const normalizedKey = aliases[key];
              if (!normalizedKey) {
                core.setFailed(`Unknown conformance override '${key}'. Supported: ${Object.keys(aliases).join(', ')}`);
                return;
              }
              overrides[normalizedKey] = value;
            }

            const applyOverrides = (config) => ({ ...config, ...overrides });
            const selectedConfigs = target === 'all'
              ? Object.values(adapterConfigs).map(applyOverrides)
              : [applyOverrides(adapterConfigs[target])];
            const openaiConfig = selectedConfigs.find((config) => config.adapter === 'openai-node');
            const nonOpenaiConfigs = selectedConfigs.filter((config) => config.adapter !== 'openai-node');
            const matrix = {
              include: nonOpenaiConfigs.length > 0
                ? nonOpenaiConfigs
                : [{
                    adapter: 'none',
                    provider_env_var: 'UNUSED',
                    provider_secret_name: 'UNUSED',
                    conformance_provider: '',
                    primary_model: '',
                    secondary_model: '',
                  }],
            };

            core.setOutput('adapter_matrix', JSON.stringify(matrix));
            core.setOutput('has_adapter_jobs', nonOpenaiConfigs.length > 0 ? 'true' : 'false');
            core.setOutput('openai_enabled', openaiConfig ? 'true' : 'false');
            core.setOutput('openai_provider_env_var', openaiConfig?.provider_env_var ?? '');
            core.setOutput('openai_provider_secret_name', openaiConfig?.provider_secret_name ?? '');
            core.setOutput('openai_conformance_provider', openaiConfig?.conformance_provider ?? '');
            core.setOutput('openai_primary_model', openaiConfig?.primary_model ?? '');
            core.setOutput('openai_secondary_model', openaiConfig?.secondary_model ?? '');
        env:
          COMMENT_BODY: ${{ inputs.comment_body }}

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.MAKAIO_GITHUB_APP_ID }}
          private-key: ${{ secrets.MAKAIO_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Log GitHub App token context
        run: |
          echo "GitHub App slug: ${{ steps.app-token.outputs.app-slug }}"
          echo "GitHub App installation ID: ${{ steps.app-token.outputs.installation-id }}"

      - name: React to comment
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ inputs.comment_id }},
              content: 'rocket',
            });

  reference-smoke:
    needs: preflight
    if: needs.preflight.outputs.openai_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-

      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: "**/node_modules"
          key: node-modules-v3-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Export openai-node provider secret
        env:
          PROVIDER_SECRET_NAME: ${{ needs.preflight.outputs.openai_provider_secret_name }}
          PROVIDER_ENV_VAR: ${{ needs.preflight.outputs.openai_provider_env_var }}
          PROVIDER_SECRET_VALUE: ${{ secrets[needs.preflight.outputs.openai_provider_secret_name] }}
        run: |
          if [ -z "${PROVIDER_SECRET_NAME}" ]; then
            echo "::error::Missing provider secret name for openai-node"
            exit 1
          fi
          if [ -z "${PROVIDER_ENV_VAR}" ]; then
            echo "::error::Missing provider environment variable for openai-node"
            exit 1
          fi
          if [ -z "${PROVIDER_SECRET_VALUE}" ]; then
            echo "::error::Missing secret '${PROVIDER_SECRET_NAME}' for openai-node"
            exit 1
          fi
          echo "${PROVIDER_ENV_VAR}=${PROVIDER_SECRET_VALUE}" >> "$GITHUB_ENV"

      - name: Run openai-node reference smoke
        env:
          MAKAIO_CONFORMANCE_PROVIDER: ${{ needs.preflight.outputs.openai_conformance_provider }}
          MAKAIO_CONFORMANCE_PRIMARY_MODEL: ${{ needs.preflight.outputs.openai_primary_model }}
          MAKAIO_CONFORMANCE_SECONDARY_MODEL: ${{ needs.preflight.outputs.openai_secondary_model }}
          MAKAIO_CONFORMANCE_LOG_DIR: conformance-artifacts/logs
          TMPDIR: conformance-artifacts/logs
        run: |
          mkdir -p conformance-artifacts/logs
          yarn test:conformance \
            -a openai-node \
            agents.simple.test.ts \
            orchestration/sendMessage.test.ts \
            --workers 1 \
            --phase reference-smoke \
            --result-output conformance-artifacts/conformance-result-openai-node-reference-smoke.json \
            --schema-violations-output conformance-artifacts/schema-violations-openai-node-reference-smoke.json

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-artifacts-openai-node-reference-smoke
          path: conformance-artifacts/**
          if-no-files-found: ignore

  reference-rest:
    needs:
      - preflight
      - reference-smoke
    if: needs.preflight.outputs.openai_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-

      - name: Restore node_modules
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: "**/node_modules"
          key: node-modules-v3-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Export openai-node provider secret
        env:
          PROVIDER_SECRET_NAME: ${{ needs.preflight.outputs.openai_provider_secret_name }}
          PROVIDER_ENV_VAR: ${{ needs.preflight.outputs.openai_provider_env_var }}
          PROVIDER_SECRET_VALUE: ${{ secrets[needs.preflight.outputs.openai_provider_secret_name] }}
        run: |
          if [ -z "${PROVIDER_SECRET_NAME}" ]; then
            echo "::error::Missing provider secret name for openai-node"
            exit 1
          fi
          if [ -z "${PROVIDER_ENV_VAR}" ]; then
            echo "::error::Missing provider environment variable for openai-node"
            exit 1
          fi
          if [ -z "${PROVIDER_SECRET_VALUE}" ]; then
            echo "::error::Missing secret '${PROVIDER_SECRET_NAME}' for openai-node"
            exit 1
          fi
          echo "${PROVIDER_ENV_VAR}=${PROVIDER_SECRET_VALUE}" >> "$GITHUB_ENV"

      - name: Run openai-node reference rest
        env:
          MAKAIO_CONFORMANCE_PROVIDER: ${{ needs.preflight.outputs.openai_conformance_provider }}
          MAKAIO_CONFORMANCE_PRIMARY_MODEL: ${{ needs.preflight.outputs.openai_primary_model }}
          MAKAIO_CONFORMANCE_SECONDARY_MODEL: ${{ needs.preflight.outputs.openai_secondary_model }}
          MAKAIO_CONFORMANCE_LOG_DIR: conformance-artifacts/logs
          TMPDIR: conformance-artifacts/logs
        run: |
          mkdir -p conformance-artifacts/logs
          yarn test:conformance \
            -a openai-node \
            --exclude agents.simple.test.ts \
            --exclude orchestration/sendMessage.test.ts \
            --phase reference-rest \
            --result-output conformance-artifacts/conformance-result-openai-node-reference-rest.json \
            --schema-violations-output conformance-artifacts/schema-violations-openai-node-reference-rest.json

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-artifacts-openai-node-reference-rest
          path: conformance-artifacts/**
          if-no-files-found: ignore

  adapter-conformance:
    needs: preflight
    if: needs.preflight.outputs.has_adapter_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.adapter_matrix) }}
    name: conformance (${{ matrix.adapter }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-

      - name: Restore node_modules
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: "**/node_modules"
          key: node-modules-v3-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install adapter CLI
        uses: ./.github/actions/install-conformance-cli
        with:
          adapter: ${{ matrix.adapter }}

      - name: Export provider secret
        env:
          PROVIDER_SECRET_NAME: ${{ matrix.provider_secret_name }}
          PROVIDER_ENV_VAR: ${{ matrix.provider_env_var }}
          PROVIDER_SECRET_VALUE: ${{ secrets[matrix.provider_secret_name] }}
        run: |
          if [ -z "${PROVIDER_ENV_VAR}" ]; then
            echo "::error::Missing provider environment variable for adapter '${{ matrix.adapter }}'"
            exit 1
          fi
          if [ -z "${PROVIDER_SECRET_VALUE}" ]; then
            echo "::error::Missing secret '${PROVIDER_SECRET_NAME}' for adapter '${{ matrix.adapter }}'"
            exit 1
          fi
          echo "${PROVIDER_ENV_VAR}=${PROVIDER_SECRET_VALUE}" >> "$GITHUB_ENV"

      - name: Run adapter smoke
        env:
          MAKAIO_CONFORMANCE_PROVIDER: ${{ matrix.conformance_provider }}
          MAKAIO_CONFORMANCE_PRIMARY_MODEL: ${{ matrix.primary_model }}
          MAKAIO_CONFORMANCE_SECONDARY_MODEL: ${{ matrix.secondary_model }}
          MAKAIO_CONFORMANCE_LOG_DIR: conformance-artifacts/logs
          TMPDIR: conformance-artifacts/logs
        run: |
          mkdir -p conformance-artifacts/logs
          yarn test:conformance \
            -a ${{ matrix.adapter }} \
            agents.simple.test.ts \
            orchestration/sendMessage.test.ts \
            --workers 1 \
            --phase adapter-smoke \
            --result-output conformance-artifacts/conformance-result-${{ matrix.adapter }}-adapter-smoke.json \
            --schema-violations-output conformance-artifacts/schema-violations-${{ matrix.adapter }}-adapter-smoke.json

      - name: Run adapter rest
        env:
          MAKAIO_CONFORMANCE_PROVIDER: ${{ matrix.conformance_provider }}
          MAKAIO_CONFORMANCE_PRIMARY_MODEL: ${{ matrix.primary_model }}
          MAKAIO_CONFORMANCE_SECONDARY_MODEL: ${{ matrix.secondary_model }}
          MAKAIO_CONFORMANCE_LOG_DIR: conformance-artifacts/logs
          TMPDIR: conformance-artifacts/logs
        run: |
          mkdir -p conformance-artifacts/logs
          yarn test:conformance \
            -a ${{ matrix.adapter }} \
            --exclude agents.simple.test.ts \
            --exclude orchestration/sendMessage.test.ts \
            --phase adapter-rest \
            --result-output conformance-artifacts/conformance-result-${{ matrix.adapter }}-adapter-rest.json \
            --schema-violations-output conformance-artifacts/schema-violations-${{ matrix.adapter }}-adapter-rest.json

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-artifacts-${{ matrix.adapter }}
          path: conformance-artifacts/**
          if-no-files-found: ignore

  conformance-report:
    needs:
      - preflight
      - reference-smoke
      - reference-rest
      - adapter-conformance
    if: |
      always() &&
      !cancelled() &&
      needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download conformance artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: conformance-artifacts-*
          path: conformance-artifacts
          merge-multiple: true

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.MAKAIO_GITHUB_APP_ID }}
          private-key: ${{ secrets.MAKAIO_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: read

      - name: Publish conformance report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- makaio-conformance-report -->';
            const dir = 'conformance-artifacts';
            const escapeCell = (value) => String(value).replace(/\|/g, '\\|').replace(/\n/g, '<br>');
            const formatDuration = (ms) => ms < 1000 ? `${Math.round(ms)}ms` : `${(ms / 1000).toFixed(1)}s`;

            const files = fs.existsSync(dir) ? fs.readdirSync(dir) : [];
            const resultFiles = files.filter((file) => file.startsWith('conformance-result-') && file.endsWith('.json'));
            const artifacts = resultFiles.flatMap((file) => {
              const artifact = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
              return artifact.runs.map((run) => ({ ...run, phase: artifact.phase ?? run.phase ?? 'unknown' }));
            });

            artifacts.sort((a, b) => `${a.adapter}:${a.phase}`.localeCompare(`${b.adapter}:${b.phase}`));

            const totalPassed = artifacts.reduce((sum, run) => sum + run.passed, 0);
            const totalFailed = artifacts.reduce((sum, run) => sum + run.failed, 0);
            const failedRuns = artifacts.filter((run) => run.status === 'failed');
            const totalSkipped = artifacts.reduce((sum, run) => sum + run.skipped, 0);
            const totalViolations = artifacts.reduce((sum, run) => sum + (run.schemaViolations?.length ?? 0), 0);
            const hasArtifacts = artifacts.length > 0;

            const lines = [
              marker,
              '## Conformance Report',
              '',
              hasArtifacts
                ? `**Summary:** ${totalPassed} passed, ${totalFailed} failed, ${totalSkipped} skipped, ${totalViolations} schema violation(s), ${failedRuns.length} failed run(s).`
                : '**Summary:** no conformance artifacts were produced.',
              '',
              '| Adapter | Phase | Status | Pass | Fail | Skip | Duration | Schema Violations |',
              '|---------|-------|--------|------|------|------|----------|-------------------|',
            ];

            for (const run of artifacts) {
              lines.push(
                [
                  `| ${escapeCell(run.adapter)}`,
                  escapeCell(run.phase),
                  escapeCell(run.status),
                  run.passed,
                  run.failed,
                  run.skipped,
                  formatDuration(run.duration),
                  `${run.schemaViolations?.length ?? 0} |`,
                ].join(' | '),
              );
            }

            const failures = artifacts.flatMap((run) =>
              [...(run.errors ?? []), ...(run.unhandledErrors ?? [])].map((error) => ({ run, error })),
            );
            if (failures.length > 0) {
              lines.push('', '### Failures');
              for (const { run, error } of failures) {
                const location = error.file ? ` (${error.file}${error.line ? `:${error.line}` : ''})` : '';
                lines.push(`- **${run.adapter} / ${run.phase}** ${error.test ?? error.name ?? 'error'}: ${error.message}${location}`);
              }
            }

            const violationRuns = artifacts.filter((run) => (run.schemaViolations?.length ?? 0) > 0);
            if (violationRuns.length > 0) {
              lines.push('', '### Schema Violations');
              for (const run of violationRuns) {
                const grouped = new Map();
                for (const violation of run.schemaViolations ?? []) {
                  grouped.set(violation.subject, (grouped.get(violation.subject) ?? 0) + 1);
                }
                for (const [subject, count] of grouped) {
                  lines.push(`- **${run.adapter} / ${run.phase}** \`${subject}\`: ${count}`);
                }
              }
              lines.push('', 'Full violation samples are attached as `schema-violations-*` artifacts.');
            }

            const body = `${lines.join('\n')}\n`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              per_page: 100,
            });

            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ inputs.pr_number }},
                body,
              });
            }

            const hasFailedRuns = failedRuns.length > 0;

            if (!hasArtifacts) {
              core.setFailed('No conformance artifacts were produced');
            } else if (totalFailed > 0 || hasFailedRuns) {
              core.setFailed('Conformance tests failed');
            } else if (totalViolations > 0) {
              core.setFailed('Schema drift detected');
