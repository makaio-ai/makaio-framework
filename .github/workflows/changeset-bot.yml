name: Changeset Bot

on:
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  resolve:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      pr_number: ${{ steps.detect.outputs.pr_number }}
      comment_id: ${{ steps.detect.outputs.comment_id }}
    steps:
      - name: Detect trigger
        id: detect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { action } = context.payload;
            const body = context.payload.comment.body ?? '';
            const prNumber = context.payload.issue.number;
            const commentId = context.payload.comment.id;
            const association = context.payload.comment.author_association;
            const trustedAssociation = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association);
            const hasConfigMarker = body.includes('<!-- changeset-config:');
            // Generate requests come from the workflow-authored config comment; external
            // users' own marker comments are still blocked by the association gate.
            const trustedConfigComment =
              context.payload.comment.user?.login === 'github-actions[bot]' && hasConfigMarker;

            if (trustedAssociation && action === 'created' && body.trim().startsWith('/changeset')) {
              core.setOutput('mode', 'post-config');
              core.setOutput('pr_number', prNumber);
              core.setOutput('comment_id', 0);
              return;
            }

            if ((trustedAssociation || trustedConfigComment) && action === 'edited' && hasConfigMarker) {
              const checked = /- \[x\] 🚀 Generate Changeset/.test(body);
              if (checked) {
                core.setOutput('mode', 'generate');
                core.setOutput('pr_number', prNumber);
                core.setOutput('comment_id', commentId);
                return;
              }
            }

            core.setOutput('mode', '');

  run:
    needs: resolve
    if: needs.resolve.outputs.mode != ''
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/changeset-bot-reusable.yml
    secrets: inherit
    with:
      mode: ${{ needs.resolve.outputs.mode }}
      pr_number: ${{ fromJSON(needs.resolve.outputs.pr_number) }}
      comment_id: ${{ fromJSON(needs.resolve.outputs.comment_id) }}
