name: Stable Release

on:
  workflow_call:
    inputs:
      bump_type:
        required: true
        type: string
        description: 'patch, minor, or major'
      pr_number:
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      bump_type: ${{ inputs.bump_type }}

    steps:
      - name: Validate bump type
        run: |
          case "${{ inputs.bump_type }}" in
            patch|minor|major) ;;
            *)
              echo "::error::Invalid bump type '${{ inputs.bump_type }}'. Use: patch, minor, or major"
              exit 1
              ;;
          esac

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true

      - name: Read base version
        id: base
        run: |
          BASE_VERSION=$(node -p "require('./apps/electrobun/package.json').version")
          echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify PR canary release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BASE_VERSION: ${{ steps.base.outputs.version }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const baseVersion = process.env.BASE_VERSION;
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedTagPrefix = `v${baseVersion}-canary.`;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const match = releases.find((release) =>
              release.prerelease &&
              release.tag_name.startsWith(expectedTagPrefix) &&
              release.body?.includes(`PR #${prNumber}:`)
            );
            if (!match) {
              core.setFailed(
                `No canary release for PR #${prNumber} and base version ${baseVersion}. Add the canary label and wait for the canary release first.`,
              );
              return;
            }
            core.info(`Verified canary release ${match.tag_name} for PR #${prNumber}.`);

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cd apps/electrobun
          npm version ${{ inputs.bump_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          cd ../..

          git add apps/electrobun/package.json
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git tag "v${NEW_VERSION}"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Fast-forward main
        run: |
          git fetch origin main:main 2>/dev/null || git checkout -b main
          git checkout main
          DEVELOP_SHA=$(git rev-parse develop)
          if ! git merge --ff-only "$DEVELOP_SHA"; then
            echo "::error::Cannot fast-forward main to develop. Has main diverged?"
            exit 1
          fi

      - name: Push branches and tag
        run: |
          git push origin develop main "${{ steps.bump.outputs.tag }}"

  build:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 60
    environment: production
    strategy:
      fail-fast: false
      matrix:
        variant: [base, cef]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-

      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: '**/node_modules'
          key: node-modules-v3-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Save Yarn cache
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}

      - name: Save node_modules
        if: steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: '**/node_modules'
          key: node-modules-v3-${{ hashFiles('yarn.lock') }}

      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm cert.p12

      - name: Write App Store Connect API key
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Build ${{ matrix.variant }} variant
        env:
          MAKAIO_VARIANT: ${{ matrix.variant }}
          ELECTROBUN_DEVELOPER_ID: ${{ vars.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ vars.ELECTROBUN_TEAMID }}
          ELECTROBUN_APPLEAPIKEYPATH: ${{ runner.temp }}/keys/AuthKey.p8
          ELECTROBUN_APPLEAPIKEY: ${{ vars.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_APPLEAPIISSUER: ${{ vars.ELECTROBUN_APPLEAPIISSUER }}
        run: yarn workspace @makaio/electrobun package:${{ matrix.variant }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-macos-${{ matrix.variant }}
          path: apps/electrobun/artifacts/

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Verify artifacts
        run: |
          test -f stable-macos-base/stable-macos-arm64-update.json
          test -f stable-macos-cef/cef-macos-arm64-update.json

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.version }}
          prerelease: true
          files: |
            stable-macos-base/*
            stable-macos-cef/*
          generate_release_notes: true

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const tag = '${{ needs.prepare.outputs.tag }}';
            const version = '${{ needs.prepare.outputs.version }}';
            const releaseUrl = `${context.payload.repository.html_url}/releases/tag/${tag}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `🚀 Stable release **${version}** created as [pre-release](${releaseUrl}).\n\nPromote to full release in the GitHub UI to update Homebrew.`,
            });
