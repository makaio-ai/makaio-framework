name: Changeset Bot Reusable

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
        description: '"post-config" or "generate"'
      pr_number:
        required: true
        type: number
      comment_id:
        required: false
        type: number
        default: 0
      framework_root:
        required: false
        type: string
        default: '.'
        description: 'Path to the framework root relative to the repository root.'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: changeset-bot-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  changeset-bot:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Resolve PR head branch
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ inputs.pr_number }},
            });
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput(
              'same_repo',
              pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}` ? 'true' : 'false',
            );

      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: trusted
          fetch-depth: 0

      - name: Reject fork changeset commits
        if: inputs.mode == 'generate' && steps.pr.outputs.same_repo != 'true'
        run: |
          echo "::error::Changeset generation commits are only supported for branches in this repository."
          exit 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install script dependencies
        run: bun install --cwd "${{ inputs.framework_root }}/scripts" --frozen-lockfile
        working-directory: trusted

      - name: Run changeset bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ARGS=("${{ inputs.mode }}" "--pr" "${{ inputs.pr_number }}" "--repo" "${{ github.repository }}")
          if [ "${{ inputs.mode }}" = "generate" ] && [ "${{ inputs.comment_id }}" != "0" ]; then
            ARGS+=("--comment-id" "${{ inputs.comment_id }}")
          fi
          bun "${{ inputs.framework_root }}/scripts/changeset-bot.ts" "${ARGS[@]}"
        working-directory: trusted
