name: Publish npm Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (dev, canary, latest)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - canary
          - latest
      dry-run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: 'npm dist-tag'
        required: true
        type: string
      dry-run:
        description: 'Dry run'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  BUN_VERSION: 1.3.12

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.tag == 'latest' && 'production' || 'canary' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-

      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: '**/node_modules'
          key: node-modules-v4-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Save Yarn cache
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}

      - name: Save node_modules
        if: steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: '**/node_modules'
          key: node-modules-v4-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Build framework
        run: yarn build:framework

      - name: Resolve publishable packages
        id: packages
        run: |
          PACKAGES=$(node -e "
            const { readdirSync, readFileSync } = require('fs');
            const { join } = require('path');
            const dirs = [
              'packages/framework',
              'packages/contracts',
              'sdks/typescript',
              'sdks/agent-sdk',
              'extensions/account-manager',
              ...readdirSync('adapters/implementations', { withFileTypes: true })
                .filter(d => d.isDirectory())
                .map(d => join('adapters/implementations', d.name))
            ];
            const publishable = dirs
              .map(dir => {
                try {
                  const pkg = JSON.parse(readFileSync(join(dir, 'package.json'), 'utf8'));
                  return pkg.private ? null : { name: pkg.name, dir };
                } catch { return null; }
              })
              .filter(Boolean);
            console.log(JSON.stringify(publishable));
          ")
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "Publishable packages:"
          echo "$PACKAGES" | node -e "JSON.parse(require('fs').readFileSync(0,'utf8')).forEach(p => console.log('  ' + p.name + ' (' + p.dir + ')'))"

      - name: Publish packages
        if: inputs.dry-run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          PACKAGES='${{ steps.packages.outputs.packages }}'

          echo "$PACKAGES" | node -e "
            const pkgs = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const { execSync } = require('child_process');

            // Topological order: contracts first, then framework, then the rest
            const order = ['@makaio/contracts', '@makaio/framework'];
            const sorted = [
              ...pkgs.filter(p => order.includes(p.name)).sort((a, b) => order.indexOf(a.name) - order.indexOf(b.name)),
              ...pkgs.filter(p => !order.includes(p.name))
            ];

            for (const pkg of sorted) {
              console.log('Publishing ' + pkg.name + '...');
              try {
                execSync(
                  'npm publish --tag ${TAG} --access public --provenance',
                  { cwd: pkg.dir, stdio: 'inherit' }
                );
                console.log('✓ ' + pkg.name);
              } catch (e) {
                console.error('✗ ' + pkg.name + ': ' + e.message);
                process.exit(1);
              }
            }
          "

      - name: Dry run — pack only
        if: inputs.dry-run == true
        run: |
          PACKAGES='${{ steps.packages.outputs.packages }}'
          echo "$PACKAGES" | node -e "
            const pkgs = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const { execSync } = require('child_process');
            for (const pkg of pkgs) {
              console.log('Packing ' + pkg.name + '...');
              execSync('npm pack --dry-run', { cwd: pkg.dir, stdio: 'inherit' });
            }
          "
