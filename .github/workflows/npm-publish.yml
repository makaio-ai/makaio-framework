name: Publish npm Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (dev, canary, latest)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - canary
          - latest
      dry-run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: 'npm dist-tag'
        required: true
        type: string
      dry-run:
        description: 'Dry run'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  BUN_VERSION: 1.3.12

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.tag == 'latest' && 'production' || 'canary' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-

      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: '**/node_modules'
          key: node-modules-v4-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Save Yarn cache
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}

      - name: Save node_modules
        if: steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: '**/node_modules'
          key: node-modules-v4-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Build all packages
        run: |
          yarn build:framework
          yarn build:adapters
          yarn build:providers
          yarn build:clients
          yarn build:extensions

      - name: Discover publishable packages
        id: packages
        run: |
          node -e "
            const { execSync } = require('child_process');
            const { readFileSync } = require('fs');
            const { join, dirname } = require('path');

            const output = execSync('yarn workspaces list --json', { encoding: 'utf8' });
            const workspaces = output.trim().split('\n').map(line => JSON.parse(line));

            const publishable = [];
            for (const ws of workspaces) {
              if (ws.location === '.') continue;
              const pkgPath = join(ws.location, 'package.json');
              let pkg;
              try {
                pkg = JSON.parse(readFileSync(pkgPath, 'utf8'));
              } catch (err) {
                console.error('Failed to read ' + pkgPath + ': ' + err.message);
                process.exit(1);
              }
              if (pkg.private) continue;
              if (!pkg.name || !pkg.name.startsWith('@makaio/')) continue;
              publishable.push({ name: pkg.name, version: pkg.version, dir: ws.location });
            }

            console.log(JSON.stringify(publishable));
          " > /tmp/packages.json

          echo "packages=$(cat /tmp/packages.json)" >> "$GITHUB_OUTPUT"

          echo "Publishable packages:"
          node -e "
            JSON.parse(require('fs').readFileSync('/tmp/packages.json', 'utf8'))
              .forEach(p => console.log('  ' + p.name + '@' + p.version + ' (' + p.dir + ')'));
          "

      - name: Publish packages
        if: inputs.dry-run == false
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: |
          node -e "
            const pkgs = JSON.parse(process.env.PACKAGES);
            const { spawnSync } = require('child_process');

            const order = ['@makaio/contracts', '@makaio/framework'];
            const sorted = [
              ...pkgs.filter(p => order.includes(p.name)).sort((a, b) => order.indexOf(a.name) - order.indexOf(b.name)),
              ...pkgs.filter(p => !order.includes(p.name))
            ];

            let failed = 0;
            for (const pkg of sorted) {
              const check = spawnSync('npm', ['view', pkg.name + '@' + pkg.version, 'version'], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'pipe'],
              });
              if (check.status === 0 && check.stdout.trim() === pkg.version) {
                console.log('⊘ ' + pkg.name + '@' + pkg.version + ' already published, skipping');
                continue;
              }

              console.log('Publishing ' + pkg.name + '@' + pkg.version + '…');
              const result = spawnSync(
                'npm',
                ['publish', '--tag', process.env.NPM_TAG, '--access', 'public', '--provenance'],
                { cwd: pkg.dir, stdio: 'inherit', env: process.env }
              );

              if (result.status !== 0) {
                console.error('✗ ' + pkg.name + ' failed with exit code ' + result.status);
                failed++;
              } else {
                console.log('✓ ' + pkg.name);
              }
            }

            if (failed > 0) {
              console.error(failed + ' package(s) failed to publish');
              process.exit(1);
            }
          "
        env:
          PACKAGES: ${{ steps.packages.outputs.packages }}

      - name: Dry run — pack only
        if: inputs.dry-run == true
        env:
          PACKAGES: ${{ steps.packages.outputs.packages }}
        run: |
          node -e "
            const pkgs = JSON.parse(process.env.PACKAGES);
            const { spawnSync } = require('child_process');
            for (const pkg of pkgs) {
              console.log('Packing ' + pkg.name + '…');
              spawnSync('npm', ['pack', '--dry-run'], { cwd: pkg.dir, stdio: 'inherit' });
            }
          "
