name: Publish dev npm packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated @makaio/* package names'
        required: true
        type: string
      dry-run:
        description: 'Pack only, do not publish or tag'
        required: false
        default: true
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: read

concurrency:
  group: npm-dev-publish-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.12
  YARN_NPM_REGISTRY_SERVER: https://registry.npmjs.org

jobs:
  publish-dev:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/publish-dev')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: canary
    env:
      DEV_PUBLISH_MANIFEST: ${{ runner.temp }}/dev-publish-packages.json
      DEV_PUBLISH_SUMMARY: ${{ runner.temp }}/dev-publish-summary.md

    steps:
      - name: Resolve request
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('packages', core.getInput('packages', { required: true }));
              core.setOutput('dry-run', core.getInput('dry-run') || 'true');
              core.setOutput('ref', context.sha);
              core.setOutput('source-sha', context.sha);
              core.setOutput('pr-number', '');
              return;
            }

            const comment = context.payload.comment;
            const body = comment.body.trim();
            const [command, ...packageNames] = body.split(/\s+/);

            if (command !== '/publish-dev') {
              core.setFailed('This workflow only handles /publish-dev comments.');
              return;
            }
            if (!context.payload.issue.pull_request) {
              core.setFailed('/publish-dev can only be used on pull requests.');
              return;
            }
            if (!['OWNER', 'MEMBER'].includes(comment.author_association)) {
              core.setFailed('/publish-dev can only be used by repository owners or members.');
              return;
            }
            if (packageNames.length === 0) {
              core.setFailed('Usage: /publish-dev @makaio/package-name [@makaio/another-package]');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.payload.issue.number,
            });

            const baseRepository = `${owner}/${repo}`;
            const headRepository = pr.head.repo.full_name;
            if (headRepository !== baseRepository) {
              core.setFailed('/publish-dev rejects fork PRs before checkout because publishing runs PR code.');
              return;
            }

            core.setOutput('packages', packageNames.join(' '));
            core.setOutput('dry-run', 'false');
            core.setOutput('ref', pr.head.sha);
            core.setOutput('source-sha', pr.head.sha);
            core.setOutput('pr-number', String(pr.number));

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.request.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-

      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: '**/node_modules'
          key: node-modules-v4-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Save Yarn cache
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-cache-${{ hashFiles('yarn.lock') }}

      - name: Save node_modules
        if: steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: '**/node_modules'
          key: node-modules-v4-${{ runner.os }}-node-24-${{ hashFiles('yarn.lock') }}

      - name: Prepare dev package versions
        run: |
          timestamp="$(node -p 'Date.now().toString()')"
          yarn tsx scripts/dev-publish.ts prepare \
            --packages "${{ steps.request.outputs.packages }}" \
            --timestamp "$timestamp" \
            --out "$DEV_PUBLISH_MANIFEST"

      - name: Build selected package closure
        run: |
          from="$(node -e "const pkgs = JSON.parse(require('fs').readFileSync(process.env.DEV_PUBLISH_MANIFEST, 'utf8')); console.log('{' + pkgs.map((pkg) => pkg.name).join(',') + '}');")"
          yarn workspaces foreach -Rpt --from "$from" run build

      - name: Pack selected packages
        run: yarn tsx scripts/dev-publish.ts pack --manifest "$DEV_PUBLISH_MANIFEST"

      - name: Publish selected packages
        if: steps.request.outputs.dry-run != 'true'
        run: yarn tsx scripts/dev-publish.ts publish --manifest "$DEV_PUBLISH_MANIFEST"

      - name: Push annotated dev tags
        if: steps.request.outputs.dry-run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          yarn tsx scripts/dev-publish.ts tag \
            --manifest "$DEV_PUBLISH_MANIFEST" \
            --source-sha "${{ steps.request.outputs.source-sha }}" \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Write publish summary
        run: |
          yarn tsx scripts/dev-publish.ts summary \
            --manifest "$DEV_PUBLISH_MANIFEST" \
            --source-sha "${{ steps.request.outputs.source-sha }}" \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --dry-run "${{ steps.request.outputs.dry-run }}" \
            --out "$DEV_PUBLISH_SUMMARY"
          cat "$DEV_PUBLISH_SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: steps.request.outputs.pr-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.request.outputs.pr-number }}'),
              body: fs.readFileSync(process.env.DEV_PUBLISH_SUMMARY, 'utf8'),
            });
