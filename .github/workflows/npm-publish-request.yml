name: Request dev npm package publish

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      comment_id:
        required: true
        type: number
      comment_url:
        required: true
        type: string
      comment_body:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: npm-dev-publish-request-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  request-dev-publish:
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Resolve publish request
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COMMENT_BODY: ${{ inputs.comment_body }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          COMMENT_URL: ${{ inputs.comment_url }}
        with:
          script: |
            const body = process.env.COMMENT_BODY.trim();
            const [command, ...packageNames] = body.split(/\s+/);
            const PACKAGE_NAME_PATTERN = /^@makaio\/[a-z0-9][a-z0-9._-]*$/u;

            if (command !== '/publish-dev') {
              core.setFailed('This workflow only handles /publish-dev comments.');
              return;
            }
            const normalizedPackageNames = [];
            const invalidPackageNames = [];
            const seenPackageNames = new Set();
            for (const packageName of packageNames.map((name) => name.trim()).filter(Boolean)) {
              if (!PACKAGE_NAME_PATTERN.test(packageName)) {
                invalidPackageNames.push(packageName);
                continue;
              }
              if (!seenPackageNames.has(packageName)) {
                normalizedPackageNames.push(packageName);
                seenPackageNames.add(packageName);
              }
            }

            if (invalidPackageNames.length > 0) {
              core.setFailed(`Invalid package name(s): ${invalidPackageNames.join(', ')}`);
              return;
            }
            if (normalizedPackageNames.length === 0) {
              core.setFailed('Usage: /publish-dev @makaio/package-name [@makaio/another-package]');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });

            const baseRepository = `${context.repo.owner}/${context.repo.repo}`;
            const headRepository = pullRequest.head.repo?.full_name;
            if (headRepository !== baseRepository) {
              core.setFailed('/publish-dev rejects fork PRs because publishing runs PR code.');
              return;
            }

            core.setOutput('packages', normalizedPackageNames.join(' '));
            core.setOutput('checkout-ref', pullRequest.head.ref);
            core.setOutput('source-sha', pullRequest.head.sha);
            core.setOutput('pr-number', process.env.PR_NUMBER);
            core.setOutput('comment-id', process.env.COMMENT_ID);
            core.setOutput('comment-url', process.env.COMMENT_URL);

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MAKAIO_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAKAIO_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Create gated canary deployment
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PACKAGES: ${{ steps.request.outputs.packages }}
          CHECKOUT_REF: ${{ steps.request.outputs.checkout-ref }}
          SOURCE_SHA: ${{ steps.request.outputs.source-sha }}
          PR_NUMBER: ${{ steps.request.outputs.pr-number }}
          COMMENT_ID: ${{ steps.request.outputs.comment-id }}
          COMMENT_URL: ${{ steps.request.outputs.comment-url }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.CHECKOUT_REF,
              environment: 'canary',
              description: `Publish dev npm packages for PR #${process.env.PR_NUMBER}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              payload: {
                packages: process.env.PACKAGES,
                dry_run: false,
                pr_number: Number(process.env.PR_NUMBER),
                comment_id: Number(process.env.COMMENT_ID),
                comment_url: process.env.COMMENT_URL,
                requested_by: context.actor,
                checkout_ref: process.env.CHECKOUT_REF,
                source_sha: process.env.SOURCE_SHA,
              },
            });

            core.setOutput('deployment-id', String(deployment.id));

      - name: Comment on PR
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PACKAGES: ${{ steps.request.outputs.packages }}
          CHECKOUT_REF: ${{ steps.request.outputs.checkout-ref }}
          SOURCE_SHA: ${{ steps.request.outputs.source-sha }}
          PR_NUMBER: ${{ steps.request.outputs.pr-number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: [
                `Requested canary deployment for \`${process.env.SOURCE_SHA}\`.`,
                '',
                `Ref: \`${process.env.CHECKOUT_REF}\``,
                '',
                `Packages: \`${process.env.PACKAGES}\``,
                '',
                `Deployment: ${{ github.server_url }}/${{ github.repository }}/deployments/activity_log?environment=canary`,
              ].join('\n'),
            });
