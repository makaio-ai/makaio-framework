name: Conformance (qwen-acp)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'adapters/implementations/qwen-acp/**'
      - 'adapters/shared/acp-client/**'
      - 'packages/clients-core/**'
      - 'adapters/core/**'
      - 'adapters/implementations/__tests__/**'
      - 'packages/contracts/**'
      - 'packages/bus-core/**'
      - 'packages/makaio-core/**'
      - 'packages/utils/**'
      - 'packages/hooks/**'
      - 'packages/kernel/**'
      - 'packages/services/core/**'
      - 'packages/services/base/**'
      - 'packages/storage/core/**'
      - 'packages/mcp-http-server/**'
      - 'tools/filesystem/**'
      - 'scripts/lib/conformance/**'
      - 'scripts/test-adapters.ts'

permissions:
  contents: read

jobs:
  conformance:
    uses: ./.github/workflows/conformance-adapter.yml
    with:
      adapter: qwen-acp
      provider_env_var: OPENAI_API_KEY
      environment: conformance-qwen-acp
