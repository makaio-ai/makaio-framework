version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 20
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
        exclude-patterns:
          # External SDKs back adapter contracts and must be reviewed as individual PRs.
          - "@agentclientprotocol/*"
          - "@anthropic-ai/*"
          - "@biomejs/biome"
          - "eslint*"
          - "@github/copilot*"
          - "@google/gemini*"
          - "@google/genai"
          - "@mariozechner/pi-*"
          - "@modelcontextprotocol/*"
          - "openai"
          - "@typescript-eslint*"
          - "prettier*"
          - "stylelint*"
      dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
        exclude-patterns:
          # External SDKs back adapter contracts and must be reviewed as individual PRs.
          - "@agentclientprotocol/*"
          - "@anthropic-ai/*"
          - "@biomejs/biome"
          - "eslint*"
          - "@github/copilot*"
          - "@google/gemini*"
          - "@google/genai"
          - "@mariozechner/pi-*"
          - "@modelcontextprotocol/*"
          - "openai"
          - "@typescript-eslint*"
          - "prettier*"
          - "stylelint*"
      linting:
        patterns: ["@biomejs/biome", "eslint*", "@typescript-eslint*", "prettier*", "stylelint*"]

  - package-ecosystem: "pip"
    directory: "/sdks/python"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/sdks/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      rust-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns: ["*"]
