version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      production-minor-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["eslint*", "@typescript-eslint*", "prettier*", "stylelint*"]
      linting:
        patterns: ["eslint*", "@typescript-eslint*", "prettier*", "stylelint*"]

  - package-ecosystem: "pip"
    directory: "/sdks/python"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/sdks/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      rust-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns: ["*"]
